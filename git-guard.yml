name: git-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all git-guard hooks
        env:
          SKIP: no-commit-to-branch
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove the hooks block bad commits
        run: |
          pip install pre-commit
          bash tests/run-tests.sh
